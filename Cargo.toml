[package]
name = "disk-usage-analyzer"
version = "1.0.0"
edition = "2021"
description = "Ultra high-performance disk usage analyzer with TUI and treemap visualization"
authors = ["Codegen <abayaz61@gmail.com>"]
license = "MIT"
build = "build.rs"

[[bin]]
name = "dua"
path = "src/main.rs"

[dependencies]
# TUI Framework
ratatui = "0.30"
crossterm = "0.29"

# Parallel Filesystem Traversal
jwalk = "0.8.1"
rayon = "1.11"

# Data Structures
slotmap = "1.1.1"
smallvec = "1.15.1"
indexmap = "2.13"

# Thread Communication
crossbeam-channel = "0.5.15"
parking_lot = "0.12.5"

# CLI
clap = { version = "4", features = ["derive"] }

# System
num_cpus = "1.17"
sysinfo = "0.38"

# Utilities
humansize = "2.1.3"
chrono = "0.4.43"
mime_guess = "2.0.5"
unicode-width = "0.2.2"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error Handling
thiserror = "2.0.18"
anyhow = "1.0.100"

# Cross-platform support
trash = "5.2"
open = "5"
dirs = "5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
